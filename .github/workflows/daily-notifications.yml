name: Daily Push Notifications & Cron Trigger

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST (Daily Pocket Money Payout Notification)
    - cron: '30 3 * * *'
    # 12:30 PM UTC = 6:00 PM IST (Daily Engaging Login Reminder)
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  trigger-daily-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Growvest Backend Daily Notification Endpoint
        run: |
          echo "Sending Daily Notification Trigger to Growvest Production Backend..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://growvest-mobile.onrender.com/api/cron/daily-notifications" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: growvest-daily-secret-2026")
          
          echo "Server Response:"
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Daily Push Notifications successfully dispatched!"
          else
            echo "⚠️ Unexpected response status: $HTTP_STATUS"
          fi

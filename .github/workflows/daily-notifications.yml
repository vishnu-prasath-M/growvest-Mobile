name: Daily Push Notifications & Cron Trigger

# Automated schedules are handled exclusively by cronjob.org to avoid duplicate pushes.
# Manual trigger remains available via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Notification type to trigger (pocket_money | chit_due | morning_tip | evening | all)'
        required: false
        default: 'all'

jobs:
  trigger-chit-due:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Chit Due Reminders (10:00 AM IST)
        run: |
          echo "==> [10:00 AM IST] Sending Chit Due Reminders (within 4 days)..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://growvest-mobile.onrender.com/api/cron/daily-notifications?type=chit_due" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: growvest-daily-secret-2026")
          echo "Server Response: $RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Chit Due reminders dispatched!"
          else
            echo "⚠️ Unexpected response: $HTTP_STATUS"
            exit 1
          fi

  trigger-pocket-money:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pocket Money Notification (8:30 AM IST)
        run: |
          echo "==> [8:30 AM IST] Sending Pocket Money Payout Notifications..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://growvest-mobile.onrender.com/api/cron/daily-notifications?type=pocket_money" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: growvest-daily-secret-2026")
          echo "Server Response: $RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Pocket Money notifications dispatched!"
          else
            echo "⚠️ Unexpected response: $HTTP_STATUS"
            exit 1
          fi

  trigger-morning-tip:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Afternoon Financial Tip (2:00 PM IST)
        run: |
          echo "==> [2:00 PM IST] Sending Afternoon Financial Growth Tip..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://growvest-mobile.onrender.com/api/cron/daily-notifications?type=morning_tip" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: growvest-daily-secret-2026")
          echo "Server Response: $RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Afternoon tip dispatched!"
          else
            echo "⚠️ Unexpected response: $HTTP_STATUS"
            exit 1
          fi

  trigger-evening-engagement:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Evening Engagement Notification (6:30 PM IST)
        run: |
          echo "==> [6:30 PM IST] Sending Evening Engagement Notification..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://growvest-mobile.onrender.com/api/cron/daily-notifications?type=evening" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: growvest-daily-secret-2026")
          echo "Server Response: $RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Evening engagement notification dispatched!"
          else
            echo "⚠️ Unexpected response: $HTTP_STATUS"
            exit 1
          fi

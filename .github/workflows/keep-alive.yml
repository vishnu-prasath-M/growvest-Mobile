name: Keep Render Server Awake 24/7

on:
  schedule:
    # Runs every 10 minutes (* /10 * * * *)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GrowVest Render Server
        run: |
          curl -s -f https://growvest-mobile.onrender.com/api/health || echo "Server waking up..."

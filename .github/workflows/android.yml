name: Build APK

on:
  push:
    branches:
      - main
      - new-ui-redesign

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Version Code with Build Number
        run: |
          node -e "
            const fs = require('fs');
            const runNum = Math.max(8, parseInt(process.env.GITHUB_RUN_NUMBER || '8', 10));
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            appJson.expo.android = appJson.expo.android || {};
            appJson.expo.android.versionCode = runNum;
            appJson.expo.version = runNum + '.0.0';
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
            console.log('Synchronized app.json versionCode to ' + runNum + ', version to ' + runNum + '.0.0');
          "
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Growvest-APK
          path: app/android/app/build/outputs/apk/release/app-release.apk

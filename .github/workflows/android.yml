name: Build APK

on:
  push:
    branches:
      - main
      - new-ui-redesign

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Version Code with Build Number
        run: |
          node -e "
            const fs = require('fs');
            const runNum = Math.max(9, parseInt(process.env.GITHUB_RUN_NUMBER || '9', 10));
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));

            const [major, minor] = (appJson.expo.version || '1.2.0').split('.');
            const basePrefix = (major || '1') + '.' + (minor || '2');

            let ver = '';
            const ref = process.env.GITHUB_REF || '';
            if (ref.startsWith('refs/tags/v')) {
              ver = ref.replace('refs/tags/v', '');
            } else if (ref.startsWith('refs/tags/')) {
              ver = ref.replace('refs/tags/', '');
            } else {
              ver = basePrefix + '.' + runNum;
            }

            appJson.expo.version = ver;
            appJson.expo.android = appJson.expo.android || {};
            appJson.expo.android.versionCode = runNum;
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));

            try {
              const pkgJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkgJson.version = ver;
              fs.writeFileSync('package.json', JSON.stringify(pkgJson, null, 2));
            } catch (_) {}

            fs.writeFileSync('build_version.txt', ver);
            console.log('Synchronized versionCode to ' + runNum + ', version to ' + ver);
          "
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF: ${{ github.ref }}

      - name: Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name APK with Version
        run: |
          VER=$(cat build_version.txt 2>/dev/null || echo "1.2.1")
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Growvest-v${VER}.apk
          echo "Created APK: Growvest-v${VER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Growvest-APK
          path: |
            app/android/app/build/outputs/apk/release/app-release.apk
            app/android/app/build/outputs/apk/release/Growvest-v*.apk

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Growvest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(14,61,35,0.12);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0E3D23 0%, #1A5C39 60%, #2E8B5A 100%);
      padding: 32px 32px 28px;
      text-align: center;
    }
    .logo-box {
      width: 60px; height: 60px;
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .header h1 { color: #fff; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .header p { color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 4px; }
    .body { padding: 32px; }
    .body h2 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; }
    .body .subtitle { color: #6b7280; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; height: 50px;
      padding: 0 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px; color: #111;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #1A5C39; }
    input[type="password"].error { border-color: #ef4444; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .error-msg { font-size: 12px; color: #ef4444; margin-top: 4px; font-weight: 500; display: none; }
    .strength-bar { height: 4px; border-radius: 2px; margin-top: 6px; background: #e5e7eb; overflow: hidden; }
    .strength-fill { height: 100%; width: 0; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    .strength-label { font-size: 11px; font-weight: 600; margin-top: 4px; }
    .btn {
      width: 100%; height: 52px;
      background: linear-gradient(135deg, #0E3D23, #1A5C39);
      color: #fff;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .alert {
      border-radius: 10px; padding: 14px 16px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 20px; display: none;
      line-height: 1.4;
    }
    .alert.success { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; display: block; }
    .alert.error-alert { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; display: block; }
    .footer { padding: 0 32px 28px; text-align: center; }
    .footer a { color: #1A5C39; font-weight: 600; font-size: 13px; text-decoration: none; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-box">🌿</div>
      <h1>Growvest</h1>
      <p>Premium Investments</p>
    </div>
    <div class="body">
      <h2>Set New Password</h2>
      <p class="subtitle">Enter a strong new password for your Growvest account.</p>

      <div id="alert" class="alert"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="Enter new password" autocomplete="new-password"/>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
          <div class="error-msg" id="passwordError"></div>
        </div>
        <div class="field">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="Re-enter new password" autocomplete="new-password"/>
          <div class="error-msg" id="confirmError"></div>
        </div>
        <button type="submit" class="btn" id="submitBtn">Reset Password</button>
      </form>
    </div>
    <div class="footer">
      <a href="https://wa.me/918300278515">Need help? Contact Support</a>
    </div>
  </div>

  <script>
    // Extract token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      showAlert('Invalid or missing reset link. Please request a new one.', 'error-alert');
      document.getElementById('resetForm').style.display = 'none';
    }

    // Password strength meter
    document.getElementById('password').addEventListener('input', function () {
      const val = this.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
      const labels = ['Weak', 'Fair', 'Good', 'Strong'];
      fill.style.width = (score * 25) + '%';
      fill.style.background = colors[score - 1] || '#e5e7eb';
      label.textContent = score > 0 ? labels[score - 1] : '';
      label.style.color = colors[score - 1] || '#9ca3af';
    });

    // Form submission
    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      let valid = true;

      // Reset errors
      document.getElementById('passwordError').style.display = 'none';
      document.getElementById('confirmError').style.display = 'none';
      document.getElementById('password').classList.remove('error');
      document.getElementById('confirm').classList.remove('error');

      if (!password || password.length < 8) {
        showFieldError('password', 'Password must be at least 8 characters');
        valid = false;
      }
      if (password !== confirm) {
        showFieldError('confirm', 'Passwords do not match');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Resetting...';

      try {
        // Detect server base from current host
        const base = window.location.origin;
        const res = await fetch(`${base}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();

        if (res.ok) {
          showAlert('✅ Password reset successfully! You can now log in with your new password.', 'success');
          document.getElementById('resetForm').style.display = 'none';
        } else {
          showAlert(data.message || 'Something went wrong. Please try again.', 'error-alert');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch (err) {
        showAlert('Network error. Please check your connection and try again.', 'error-alert');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });

    function showFieldError(fieldId, message) {
      const input = document.getElementById(fieldId);
      const errEl = document.getElementById(fieldId + 'Error');
      input.classList.add('error');
      errEl.textContent = message;
      errEl.style.display = 'block';
    }

    function showAlert(message, type) {
      const el = document.getElementById('alert');
      el.className = 'alert ' + type;
      el.textContent = message;
    }
  </script>
</body>
</html>
